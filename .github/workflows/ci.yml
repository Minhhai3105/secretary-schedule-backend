name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: secretary_schedule_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secretary_schedule_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci_postgres_password@127.0.0.1:5432/secretary_schedule_test
      JWT_SECRET: ci-only-secret-key-at-least-32-characters-long
      AUTH_COOKIE_SECURE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and verify environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply and verify Alembic migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          DB_ADMIN_PASSWORD: ci-admin-password-placeholder
          DB_PASSWORD: ci-app-password-placeholder
          JWT_SECRET: ci-only-secret-key-at-least-32-characters-long
        run: |
          docker compose config --quiet
          docker compose --profile worker config --quiet

      - name: Build backend container image
        run: docker build -t secretary-schedule-backend:ci .
