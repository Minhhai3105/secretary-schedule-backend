services:
  worker:
    profiles: !reset []

  web:
    build:
      context: ${FRONTEND_CONTEXT:-../secretary-schedule-frontend}
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
